<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ✏️ 브라우저 탭에 보이는 제목 -->
  <title>[닉네임]의 Coding Lab</title>

  <!-- 글꼴: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    /* ===== 색상 (여기만 바꾸면 전체 색이 바뀌어요) ===== */
    :root {
      --navy: #0e1733;        /* 배경 */
      --navy-card: #16224a;   /* 카드 배경 */
      --navy-line: #283a73;   /* 테두리 */
      --purple: #8b5cf6;      /* 포인트 색 */
      --purple-soft: #c4b5fd; /* 연한 보라 */
      --text: #eceffa;        /* 본문 글자 */
      --muted: #9ba6cf;       /* 흐린 글자 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--navy);
      color: var(--text);
      font-family: "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== 상단 ===== */
    header {
      padding: 96px 0 64px;
      border-bottom: 1px solid var(--navy-line);
    }

    .title {
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    /* 제목 끝에서 깜빡이는 보라색 커서 */
    .title::after {
      content: "";
      display: inline-block;
      width: 0.45em;
      height: 0.9em;
      margin-left: 0.12em;
      background: var(--purple);
      vertical-align: -0.08em;
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .intro {
      margin-top: 20px;
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 36em;
    }

    /* ===== 작품 목록 ===== */
    main { padding: 56px 0 80px; }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .section-title span { color: var(--purple-soft); font-weight: 500; }

    /* 컴퓨터: 3열 / 태블릿: 2열 / 휴대폰: 1열 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      header { padding: 64px 0 44px; }
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--navy-card);
      border: 1px solid var(--navy-line);
      border-radius: 14px;
      padding: 26px 24px 24px;
    }

    .card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--muted);
      font-size: 0.97rem;
      flex: 1;              /* 설명 길이가 달라도 버튼 위치를 맞춰줌 */
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 18px 0 22px;
      list-style: none;
    }

    .tags li {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--purple-soft);
      background: rgba(139, 92, 246, 0.14);
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .run-btn {
      display: block;
      text-align: center;
      background: var(--purple);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .run-btn:hover { background: #7c3aed; }

    .run-btn:focus-visible {
      outline: 3px solid var(--purple-soft);
      outline-offset: 3px;
    }

    footer {
      padding: 28px 0 40px;
      color: var(--muted);
      font-size: 0.88rem;
      border-top: 1px solid var(--navy-line);
    }

    /* 움직임 줄이기 설정을 켠 사람에겐 커서를 멈춤 */
    @media (prefers-reduced-motion: reduce) {
      .title::after { animation: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="wrap">
      <!-- ✏️ [닉네임]을 내 닉네임으로 바꾸세요 -->
      <h1 class="title">[닉네임]의 Coding Lab</h1>
      <!-- ✏️ 나를 한 줄로 소개해 보세요 -->
      <p class="intro">궁금한 건 직접 만들어 보는 고등학생 개발자입니다.</p>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h2 class="section-title">내 작품 <span id="count"></span></h2>
      <!-- 작품 카드는 script.js가 여기에 자동으로 채워 넣어요 -->
      <div class="grid" id="project-list"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      © <span id="year"></span> [닉네임] · GitHub Pages로 만든 포트폴리오
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
